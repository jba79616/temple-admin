services:
  postgres:
    image: postgres:16-alpine
    container_name: temple-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: temple
      POSTGRES_USER: temple
      POSTGRES_PASSWORD: temple
      TZ: Asia/Taipei
      PGTZ: Asia/Taipei
    command: ["postgres", "-c", "timezone=Asia/Taipei"]
    ports:
      - "55432:5432"
    volumes:
      - temple_pg_data:/var/lib/postgresql/data

volumes:
  temple_pg_data:
