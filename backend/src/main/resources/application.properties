spring.application.name=temple-admin

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/temple}
spring.datasource.username=${DB_USER:temple}
spring.datasource.password=${DB_PASSWORD:temple}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Taipei

spring.flyway.enabled=true

server.port=${PORT:8080}
server.servlet.session.timeout=12h

temple.zone=Asia/Taipei
temple.admin.username=${TEMPLE_ADMIN_USERNAME:admin}
temple.admin.password=${TEMPLE_ADMIN_PASSWORD:admin123}
